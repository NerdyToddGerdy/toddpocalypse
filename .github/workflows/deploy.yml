name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # §6 requires a vX.Y.Z tag on every release commit. Automated here so it
  # cannot drift again — see docs/franchise-divergences.md.
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag the release
        run: |
          set -euo pipefail
          version=$(node -e 'const src = require("fs").readFileSync("src/changelog.ts", "utf8");
            const match = src.match(/VERSION = "(v[0-9]+\.[0-9]+\.[0-9]+)"/);
            if (!match) { console.error("no VERSION found in src/changelog.ts"); process.exit(1); }
            console.log(match[1]);')

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "$version is already tagged — nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$(git log -1 --format=%s)"
          git push origin "$version"
          echo "tagged $version at $(git rev-parse --short HEAD)"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
