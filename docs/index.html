<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toddpocalypse</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">Initializing…</div>
</div>

<div id="creation-overlay">
  <div id="creation-box">
    <h2>Create Your Character</h2>
    <label for="char-name-input">Name</label>
    <input id="char-name-input" type="text" maxlength="20" placeholder="Hero" autocomplete="off" />
    <div id="class-label">Class</div>
    <div id="class-picker">
      <button class="class-btn selected" data-class="fighter">⚔ Fighter</button>
      <button class="class-btn" data-class="rogue">🗡 Rogue</button>
      <button class="class-btn" data-class="mage">🔮 Mage</button>
    </div>
    <div id="class-desc"></div>
    <button id="start-btn">Begin Adventure</button>
  </div>
</div>

<header>
  <h1>Toddpocalypse</h1>
  <div id="stats-bar">
    <div>Gold: <span id="stat-gold">0</span></div>
    <div>Level: <span id="stat-level">1</span></div>
    <div>Kills: <span id="stat-kills">0</span></div>
  </div>
</header>

<main>

  <!-- Enemy + attack -->
  <section id="enemy-panel">
    <div id="enemy-header">
      <div id="enemy-name">Loading…</div>
      <div id="enemy-level"></div>
    </div>
    <div class="hp-bar-wrap">
      <div id="enemy-hp-bar" style="width:100%"></div>
    </div>
    <div id="enemy-hp-text"></div>
    <button id="attack-btn" disabled>⚔ Attack</button>
  </section>

  <!-- Party -->
  <section id="party-panel">
    <h2>Your Party</h2>
    <div id="party-cards"></div>
  </section>

  <!-- Sidebar -->
  <aside id="sidebar">

    <section id="loot-panel">
      <div id="loot-header">
        <h2>Loot <span id="loot-count"></span></h2>
        <button class="equip-all-btn" data-action="equip-all" disabled>Equip All</button>
      </div>
      <div id="loot-items"><div class="loot-empty">No drops yet…</div></div>
    </section>

    <section id="upgrades-panel">
      <h2>Upgrades</h2>
      <div id="upgrade-cards"></div>
    </section>

    <section id="log-panel">
      <h2>Combat Log</h2>
      <div id="combat-log"></div>
    </section>

  </aside>

</main>

<script src="game.js"></script>
</body>
</html>
